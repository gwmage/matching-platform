<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>연결 흐름</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style> body { font-family: 'Malgun Gothic', system-ui, sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div class="max-w-3xl mx-auto p-6">
    <header class="mb-6">
      <h1 class="text-2xl font-bold text-slate-800">연결 요청 → 수락 → 연락처 공개</h1>
      <p class="text-slate-500 mt-1">개인정보는 <b>양쪽이 수락한 뒤에만</b> 공개됩니다. 그 전엔 'OOO 전문가'로 가립니다.</p>
    </header>
    <div class="grid md:grid-cols-3 gap-4">
      <div class="bg-white rounded-xl shadow-sm p-5 border-t-4 border-indigo-400">
        <div class="text-xs font-bold text-indigo-500 mb-2">STEP 1 · 연결 요청</div>
        <div class="text-lg font-bold text-slate-800 mb-1">김OO 전문가</div>
        <div class="text-xs text-slate-400 mb-3">Nest.js · 적합도 92</div>
        <div class="text-sm text-slate-500 mb-3">연락처는 아직 비공개</div>
        <button class="w-full bg-indigo-600 text-white rounded-lg py-2 text-sm font-bold">연결 요청 보내기</button>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-5 border-t-4 border-amber-400">
        <div class="text-xs font-bold text-amber-500 mb-2">STEP 2 · 상대 수락</div>
        <div class="text-lg font-bold text-slate-800 mb-1">요청 도착</div>
        <div class="text-xs text-slate-400 mb-3">"멘토링을 요청합니다"</div>
        <div class="flex gap-2">
          <button class="flex-1 bg-emerald-500 text-white rounded-lg py-2 text-sm font-bold">수락</button>
          <button class="flex-1 bg-slate-100 text-slate-500 rounded-lg py-2 text-sm font-bold">거절</button>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-5 border-t-4 border-emerald-400">
        <div class="text-xs font-bold text-emerald-500 mb-2">STEP 3 · 연락처 공개</div>
        <div class="text-lg font-bold text-slate-800 mb-1">김도현</div>
        <div class="text-sm text-slate-600">✉️ dohyun@example.com</div>
        <div class="text-sm text-slate-600 mb-2">📞 010-1234-5678</div>
        <div class="text-xs text-emerald-600 font-semibold">양쪽 수락 완료 — 이제 직접 소통</div>
      </div>
    </div>
    <p class="text-center text-slate-400 text-xs mt-6">화면이 아니라 백엔드가 '수락 여부'를 확인한 뒤에만 연락처를 내려준다(22장 권한 원칙).</p>
  </div>
</body>
</html>
