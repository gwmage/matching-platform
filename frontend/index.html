<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 에이전트 매칭</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style> body { font-family: 'Malgun Gothic', system-ui, sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div class="max-w-2xl mx-auto p-6">
    <header class="mb-5">
      <h1 class="text-2xl font-bold text-slate-800">AI 전문가 매칭</h1>
      <p class="text-slate-500 mt-1">원하는 멘토를 자연어로 말하면, AI 에이전트가 후보를 찾아 점수와 추천 이유까지 정리해줍니다.</p>
    </header>

    <div class="bg-white rounded-xl shadow-sm p-5 mb-5">
      <div class="flex gap-2">
        <input id="q" value="주말에 가능한 Nest.js 멘토 찾아줘" class="border border-slate-300 rounded-lg px-3 py-2 flex-1" />
        <button id="go" class="bg-indigo-600 text-white rounded-lg px-5 py-2 font-semibold hover:bg-indigo-700">매칭 요청</button>
      </div>
    </div>

    <div id="status" class="hidden text-center text-indigo-600 font-semibold py-6">
      <span class="inline-block animate-pulse">🤖 에이전트가 분석 중… (검색 → 일정 확인 → 점수 계산 → 추천 이유 작성)</span>
    </div>

    <div id="results" class="space-y-4"></div>
  </div>

  <script>
    const API = 'http://localhost:3002/api';
    const bar = (label, v, color) => `
      <div class="flex items-center gap-2 text-xs">
        <span class="w-12 text-slate-500">${label}</span>
        <div class="flex-1 bg-slate-100 rounded h-2"><div class="${color} h-2 rounded" style="width:${v}%"></div></div>
        <span class="w-8 text-right text-slate-600">${v}</span>
      </div>`;

    document.getElementById('go').onclick = async () => {
      const q = document.getElementById('q').value.trim();
      if (!q) return;
      document.getElementById('results').innerHTML = '';
      document.getElementById('status').classList.remove('hidden');
      try {
        const res = await fetch(`${API}/match`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query: q }),
        });
        const data = await res.json();
        document.getElementById('status').classList.add('hidden');
        const box = document.getElementById('results');
        (data.matches || []).forEach((m, i) => {
          const tags = (m.expertise || []).map(t => `<span class="bg-indigo-50 text-indigo-700 text-xs px-2 py-0.5 rounded">${t}</span>`).join(' ');
          box.innerHTML += `
            <div class="bg-white rounded-xl shadow-sm p-5">
              <div class="flex justify-between items-start">
                <div>
                  <div class="text-xs text-slate-400">추천 ${i + 1}위</div>
                  <div class="text-lg font-bold text-slate-800">${m.maskedName}</div>
                  <div class="mt-1 flex flex-wrap gap-1">${tags}</div>
                </div>
                <div class="text-right">
                  <div class="text-3xl font-bold text-indigo-600">${m.score}</div>
                  <div class="text-xs text-slate-400">적합도</div>
                </div>
              </div>
              <div class="mt-3 space-y-1">
                ${bar('전문분야', m.breakdown.expertise, 'bg-indigo-500')}
                ${bar('일정', m.breakdown.schedule, 'bg-emerald-500')}
                ${bar('만족도', m.breakdown.rating, 'bg-amber-500')}
                ${bar('소통', m.breakdown.style, 'bg-sky-500')}
              </div>
              <p class="mt-3 text-sm text-slate-700 bg-slate-50 rounded-lg p-3">💬 ${m.reason}</p>
            </div>`;
        });
        if (!(data.matches || []).length) box.innerHTML = '<p class="text-center text-slate-500 py-6">조건에 맞는 후보가 없습니다.</p>';
      } catch (e) {
        document.getElementById('status').classList.add('hidden');
        document.getElementById('results').innerHTML = `<p class="text-red-600 text-center py-6">오류: ${e.message}</p>`;
      }
    };
  </script>
</body>
</html>
