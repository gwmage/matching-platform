<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보안 점검</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style> body { font-family: 'Malgun Gothic', system-ui, sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div class="max-w-2xl mx-auto p-6">
    <header class="mb-6">
      <h1 class="text-2xl font-bold text-slate-800">배포 전 보안 점검</h1>
      <p class="text-slate-500 mt-1">권한·요청 제한이 실제로 막히는지, 비밀이 새지 않는지 확인합니다.</p>
    </header>

    <div class="bg-white rounded-xl shadow-sm p-5 mb-4">
      <h2 class="text-sm font-semibold text-slate-700 mb-3">① 권한 검사 (남의 데이터 접근)</h2>
      <div id="authz" class="text-sm">테스트 중…</div>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-5 mb-4">
      <h2 class="text-sm font-semibold text-slate-700 mb-3">② 요청 제한 (짧은 시간에 반복 요청)</h2>
      <div id="rate" class="space-y-1 text-sm font-mono"></div>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-5">
      <h2 class="text-sm font-semibold text-slate-700 mb-3">③ 배포 전 체크리스트</h2>
      <ul id="check" class="space-y-2 text-sm"></ul>
    </div>
  </div>
  <script>
    const API = 'http://localhost:3002/api';
    (async () => {
      // ① 403
      const r = await fetch(`${API}/match/demo/owner?me=1&target=2`);
      document.getElementById('authz').innerHTML = r.status === 403
        ? `<div class="bg-rose-50 border border-rose-200 rounded-lg px-3 py-2 text-rose-700 font-semibold">⛔ 남의 데이터 요청 → <b>403 Forbidden</b> 으로 차단됨 — "다른 사용자의 데이터에 접근할 수 없습니다."</div>
           <div class="text-xs text-slate-400 mt-1">권한 판단은 화면이 아니라 백엔드가 강제한다.</div>`
        : '예상과 다름(점검 필요)';
      // ② 429
      const box = document.getElementById('rate');
      for (let i = 1; i <= 8; i++) {
        const res = await fetch(`${API}/match/demo/ratelimit`);
        const ok = res.status === 200;
        box.innerHTML += `<div class="${ok?'text-slate-600':'text-rose-600 font-bold'}">요청 ${i}: ${ok ? '200 OK ✓' : '429 Too Many Requests ⛔ "잠시 후 다시 시도해주세요"'}</div>`;
      }
      // ③ 체크리스트
      const items = [['소스코드에 API 키 하드코딩 없음 (.env로 분리)', true],
                     ['.gitignore에 .env·*.db 포함 (비밀 미커밋)', true],
                     ['배포 시 HTTPS 자동 적용 (Vercel/Railway)', true],
                     ['남의 데이터 접근 403 차단', true],
                     ['과도한 반복 요청 429 제한', true]];
      document.getElementById('check').innerHTML = items.map(([t]) =>
        `<li class="flex items-center gap-2"><span class="text-emerald-500 text-lg">✅</span><span class="text-slate-700">${t}</span></li>`).join('');
    })();
  </script>
</body>
</html>
