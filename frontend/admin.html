<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>매칭 플랫폼 관리자 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style> body { font-family: 'Malgun Gothic', system-ui, sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div class="max-w-3xl mx-auto p-6">
    <header class="mb-6">
      <h1 class="text-2xl font-bold text-slate-800">매칭 운영 대시보드</h1>
      <p class="text-slate-500 mt-1">요청량·매칭 성공률·AI 비용·만족도를 매일 확인합니다.</p>
    </header>
    <div id="cards" class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6"></div>
    <div class="bg-white rounded-xl shadow-sm p-5 mb-5">
      <h2 class="text-sm font-semibold text-slate-700 mb-4">📈 날짜별 매칭 요청 수</h2>
      <div id="chart" class="flex items-end gap-3 h-40"></div>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-5">
      <h2 class="text-sm font-semibold text-slate-700 mb-3">⭐ 누적 만족도</h2>
      <div id="sat" class="text-sm text-slate-600"></div>
    </div>
  </div>
  <script>
    const API = 'http://localhost:3002/api';
    const card = (label, value, color) => `
      <div class="bg-white rounded-xl shadow-sm p-4 border-l-4 ${color}">
        <div class="text-2xl font-bold text-slate-800">${value}</div>
        <div class="text-xs text-slate-500 mt-1 font-semibold">${label}</div>
      </div>`;
    (async () => {
      const s = await (await fetch(`${API}/match/stats`)).json();
      document.getElementById('cards').innerHTML =
        card('총 요청', s.totalRequests + '건', 'border-indigo-400') +
        card('매칭 성공률', s.successRate + '%', 'border-emerald-400') +
        card('AI 비용', '₩' + s.estCostKrw, 'border-amber-400') +
        card('평균 만족도', s.avgScore + '/5', 'border-sky-400') +
        card('불만족', s.dissatisfied + '건', 'border-rose-400');
      const max = Math.max(1, ...s.byDay.map(d => d.count));
      document.getElementById('chart').innerHTML = s.byDay.map(d => `
        <div class="flex-1 flex flex-col items-center justify-end h-full">
          <div class="text-xs text-slate-500 mb-1">${d.count}</div>
          <div class="w-full bg-indigo-500 rounded-t" style="height:${Math.round(d.count / max * 100)}%"></div>
          <div class="text-[11px] text-slate-400 mt-1">${d.day}</div>
        </div>`).join('');
      document.getElementById('sat').innerHTML =
        `총 <b>${s.feedbackCount}</b>건 응답 · 평균 <b class="text-indigo-600">${s.avgScore}/5</b> · 불만족(2점 이하) <b class="text-rose-600">${s.dissatisfied}건</b>
         <div class="text-xs text-slate-400 mt-1">불만족 비율이 높은 조건은 가중치를 재조정하는 근거가 된다.</div>`;
    })();
  </script>
</body>
</html>
